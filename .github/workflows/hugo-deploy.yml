name: Deploy all websites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main website
        uses: actions/checkout@v4
        with:
          path: main-site

      - name: Checkout joinus website
        uses: actions/checkout@v4
        with:
          repository: huangcx1817/joinus
          ref: main
          path: joinus-site

      - name: Checkout haitun website
        uses: actions/checkout@v4
        with:
          repository: genuineknowledge/haitun
          ref: main
          path: haitun-site

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true

      - name: Build main website
        working-directory: main-site
        run: hugo --gc --minify

      - name: Build Haitun website
        working-directory: haitun-site
        run: hugo --gc --minify --baseURL "https://www.genuineknowledge.cn/haitun/"

      - name: Create subdirectories
        run: |
          mkdir -p main-site/public/joinus
          mkdir -p main-site/public/haitun

      - name: Copy joinus website
        run: |
          cp -R joinus-site/. main-site/public/joinus/

      - name: Copy Haitun website
        run: |
          cp -R haitun-site/public/. main-site/public/haitun/

      - name: Preserve custom domain
        run: |
          echo "www.genuineknowledge.cn" > main-site/public/CNAME

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
